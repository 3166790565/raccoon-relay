# 小浣熊反代：全栈部署（relay + Postgres + Redis）
#
# 这是一个完整、自包含的编排文件，单独使用即可：
#   docker compose up -d
#
# 前提：.env 里必须有 SECRET_KEY、ADMIN_TOKEN、POSTGRES_PASSWORD、REDIS_PASSWORD。
#
# 只想用 SQLite 单容器（不用 Postgres/Redis）：
#   把 relay 服务里的 DATABASE_URL / REDIS_URL 两行删掉（或注释），
#   并去掉 depends_on 与文件末尾的 postgres / redis 服务。

services:
  relay:
    image: bxacc123/raccoon-relay:${IMAGE_TAG:-latest}
    container_name: raccoon-relay
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      # 容器内监听全部地址，宿主机端口映射决定对外暴露面
      LISTEN_ADDR: 0.0.0.0:8080
      TZ: ${TZ:-Asia/Shanghai}
      DATABASE_URL: postgres://relay:${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}@postgres:5432/relay?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:?请在 .env 设置 REDIS_PASSWORD}@redis:6379/0
      REDIS_PREFIX: ${REDIS_PREFIX:-raccoon:}
      # 多副本部署建议打开；单实例也开着无害
      REDIS_REQUIRED: ${REDIS_REQUIRED:-0}
    ports:
      # 数据面与管理面同端口，全部对外开放
      - "8080:8080"
    volumes:
      # 数据目录必须持久化：旧 relay.db（迁移源）、日志都在这里
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 不设内存上限：转发路径会把整条请求体读进内存，大上下文（实测单条最高 74 万
    # token）叠加不限并发时，曾用 256m 的上限被反复打爆并触发 cgroup OOM（3 次），
    # 每次都要重建容器。宿主机内存充裕（16G），由内核按需分配即可。
    #
    # 注意：不加 mem_limit 就等于不限制；而 docker update --memory 0 对运行中的
    # 容器是空操作（Docker 把 0 当成「不改」），改配置后必须重建容器才生效。
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: raccoon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: relay
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    # 默认不暴露到宿主机；需要外部工具连库时再取消注释
    # ports:
    #   - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    container_name: raccoon-redis
    restart: unless-stopped
    # noeviction：锁 key 被 LRU 驱逐会让分布式锁静默失效。
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?请在 .env 设置 REDIS_PASSWORD}
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # ports:
    #   - "127.0.0.1:6379:6379"

volumes:
  pg_data:
  redis_data: