name: build-and-push

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  IMAGE: bxacc123/raccoon-relay

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # 带真实 token 的样例不进仓库，往返测试会自动跳过，其余用例必须全过
      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

  build:
    name: 构建并推送镜像
    needs: test
    # PR 只做验证不推送，避免 fork 来的 PR 拿到推送权限
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 设置 QEMU（跨架构模拟）
        uses: docker/setup-qemu-action@v3

      - name: 设置 buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成标签与元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # 推 master → latest
            type=raw,value=latest,enable={{is_default_branch}}
            # 推 tag v1.2.3 → 1.2.3 与 1.2
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # 每次构建都带一个日期-短 SHA 标签，便于回滚到具体提交
            type=raw,value={{date 'YYYYMMDD'}}-{{sha}},enable={{is_default_branch}}

      - name: 构建并推送（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions 缓存，避免每次都重下 Go 模块
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
