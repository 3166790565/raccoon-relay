name: build-and-push

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  IMAGE: bxacc123/raccoon-relay

# 同一时间只允许一个镜像构建，避免「推 master + 推 tag」并发互相覆盖 latest。
# 注意用固定 group（不能带 github.ref）：master 和 tag 是不同的 ref，
# 按 ref 分组等于没锁，两次构建照样同时跑。
# cancel-in-progress 关闭：正在推镜像时被取消会留下不完整的 tag。
concurrency:
  group: docker-image-push
  cancel-in-progress: false

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # 带真实 token 的样例不进仓库，往返测试会自动跳过，其余用例必须全过
      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

  # 同一套 store 测试在 Postgres 下再跑一遍。只覆盖 internal/store：
  # scheduler 依赖 60s tick 语义、relay 的 e2e 依赖 SQLite 单连接顺序，
  # 强行放 PG 会引入与方言无关的不稳定。
  test-postgres:
    name: 测试（Postgres）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://relay:relay@localhost:5432/relay_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: go test (store, postgres)
        run: go test ./internal/store/... -count=1

  build:
    name: 构建并推送镜像
    needs: test
    # PR 只做验证不推送，避免 fork 来的 PR 拿到推送权限
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 设置 QEMU（跨架构模拟）
        uses: docker/setup-qemu-action@v3

      - name: 设置 buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成标签与元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # 推 master 或推正式 tag 都更新 latest；预发布 tag（v1.0.4-rc1）不覆盖 latest
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            # 推 tag v1.2.3 → 1.2.3 与 1.2
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # 默认分支的每次构建额外带一个日期-短 SHA 标签，便于回滚到具体提交
            type=raw,value={{date 'YYYYMMDD'}}-{{sha}},enable={{is_default_branch}}

      - name: 构建并推送（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # 让服务端能准确报告自己跑的是哪个版本前缀；tag 构建用 tag，默认分支用短 SHA
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions 缓存，避免每次都重下 Go 模块
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  # ===== 发布二进制：一键更新从这里拉 =====
  # 只有推 tag（v*）才产出 Release 资产。面板「一键更新」按
  # relay-<os>-<arch>[.exe] + checksums.txt 去匹配，改文件名要同步改 internal/updater。
  release-binaries:
    name: 构建发布二进制
    needs: test
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: 编译
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          VERSION: ${{ github.ref_name }}
        run: |
          suffix=""
          [ "$GOOS" = "windows" ] && suffix=".exe"
          out="relay-${GOOS}-${GOARCH}${suffix}"
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "dist/${out}" ./cmd/relay
          # 每个矩阵任务先把自己的校验行收集起来，汇总任务再合并
          ( cd dist && sha256sum "${out}" > "${out}.sha256" )

      - uses: actions/upload-artifact@v4
        with:
          name: relay-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/relay-*
          if-no-files-found: error

  publish:
    name: 发布 Release
    needs: release-binaries
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 汇总校验文件
        run: |
          cd dist
          rm -f checksums.txt
          cat *.sha256 | sort > checksums.txt
          cat checksums.txt

      - name: 创建 / 更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/relay-* dist/checksums.txt --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" dist/relay-* dist/checksums.txt               --repo "${{ github.repository }}"               --title "$TAG" --generate-notes
          fi
